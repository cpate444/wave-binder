<!DOCTYPE html>
<html lang="en">
<head>

<title>Wave Wellness Ops Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="css">
:root{
  /* Layout: sticky header + scrolling tab strip, one working panel per binder section */
  --bg:#f4f7f7; --surface:#ffffff; --ink:#10282e; --muted:#5b7076; --line:#dbe4e5;
  --accent:#0d7c86; --accent-soft:#dff1f1; --wave:#0b3c49; --good:#2f8a4e; --warn:#b7791f; --bad:#b4423a;
  --display:"Fraunces", Georgia, serif; --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1a1e; --surface:#11252b; --ink:#e4f0f1; --muted:#93a9ae; --line:#23404a;
    --accent:#4cc3c9; --accent-soft:#16383e; --wave:#08151a; --good:#5fc27f; --warn:#e0a84a; --bad:#e2766c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1a1e; --surface:#11252b; --ink:#e4f0f1; --muted:#93a9ae; --line:#23404a;
  --accent:#4cc3c9; --accent-soft:#16383e; --wave:#08151a; --good:#5fc27f; --warn:#e0a84a; --bad:#e2766c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

header.top{background:var(--wave);color:#e8f6f6;position:sticky;top:0;z-index:20}
.top-inner{max-width:1200px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;color:#fff}
.brand p{margin:2px 0 0;font-size:.8rem;color:#9fc9cc}
.save-state{font-size:.78rem;color:#9fc9cc;padding-bottom:4px}
nav.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;color:#b9dcde;text-decoration:none;font-size:.88rem;font-weight:600;padding:8px 12px;border-radius:8px 8px 0 0}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
main > *{min-width:0}
main{max-width:1200px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:18px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.section-head p{margin:4px 0 0;color:var(--muted);max-width:65ch;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card > h3{margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .label{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .value{font-family:var(--display);font-size:1.6rem;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--muted)}
.tile.go{border-left:4px solid var(--accent);cursor:pointer}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right}
tr.sect td{background:var(--accent-soft);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
tr.hi td{background:var(--accent-soft);font-weight:700}
table.inc td.fy,table.inc th.fy{background:var(--accent-soft);font-weight:700}
tr.pctrow td{color:var(--muted);font-size:.8rem;font-style:italic;border-bottom:1px solid var(--line)}
td.pct{color:var(--muted)}
.tile .value.neg{color:var(--bad)}
tr.unpaid td{color:var(--muted)}
.dept li .pill{flex:0 0 auto}
tr.sect td.n{font-size:.8rem}
tr.subtot td{font-weight:700;font-style:normal;border-top:1px solid var(--muted)}
td.neg{color:var(--bad)}
.stick-col{position:sticky;left:0;background:var(--surface);z-index:1}

input.cell{width:100%;min-width:60px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px}
input.cell:hover{border-color:var(--line)}
input.cell:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.cell.n{text-align:right;font-variant-numeric:tabular-nums}
input.cell.edit{color:var(--accent);font-weight:600}
.w-s{width:70px}.w-m{width:100px}.w-l{width:200px}
td > input.cell[type=text]{width:auto;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:.78rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0;max-width:70ch}
.flag{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 8%,var(--surface));border-radius:0 8px 8px 0;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.inline{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600}
label.inline input[type=number],label.inline input[type=text]{width:110px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}

/* schedule grid */
.sched td,.sched th{padding:0;border:1px solid var(--line);text-align:center}
.sched th{padding:6px 4px;min-width:74px;white-space:normal;line-height:1.15}
.sched th input{width:auto;min-width:72px;border:0;background:transparent;text-align:center;font-weight:700;font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.sched td.time{padding:4px 8px;font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;background:var(--surface)}
.slot{width:100%;height:26px;border:0;background:transparent;cursor:pointer;display:block}
.slot[aria-pressed="true"]{background:var(--accent)}
.slot:hover{outline:1px solid var(--accent);outline-offset:-1px}
.sched td.duty{font-size:.78rem;font-weight:700;padding:0 6px}
.sched tr.foot td{font-weight:700;font-size:.8rem;padding:6px 4px;background:var(--accent-soft)}

/* org chart */
.org-ceo{display:flex;justify-content:center}
.person{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;text-align:center;display:grid;gap:2px;align-content:start}
.person .role-input{border:1px solid transparent;border-radius:6px;background:transparent;text-align:center;font:inherit;font-size:.74rem;line-height:1.25;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;width:100%;resize:none;overflow:hidden;padding:2px}
.person .role-input:hover,.person input:hover{border-color:var(--line)}
.person .role-input:focus,.person input:focus{border-color:var(--accent);outline:none}
.person input{border:1px solid transparent;border-radius:6px;background:transparent;text-align:center;font-weight:700;font-size:1rem;width:100%;padding:2px}
.person .remove{position:absolute;top:2px;right:2px;font-size:.95rem;opacity:.5}
.person.ceo{border:2px solid var(--accent);width:min(260px,100%)}
.lead-head{text-align:center;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-family:var(--body)}
.execs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dept .lead{display:grid;gap:2px}
.dept .lead span{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.dept .lead input{font-weight:600;color:var(--ink);padding:3px 4px}
.connector{height:18px;width:2px;background:var(--line);margin:0 auto}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.dept{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:12px}
.dept h3{font-size:1rem}
.dept .lead{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.dept ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dept li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.88rem}
.dept li input{width:52px;text-align:right}
.dept .sum{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:.8rem;font-weight:700;display:flex;justify-content:space-between}

/* bars */
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:110px 1fr 110px;gap:8px;align-items:center;font-size:.85rem}
.bar-track{height:14px;background:var(--accent-soft);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:7px}
.bar-row.on span:first-child{font-weight:700;color:var(--accent)}
.tile.active{border:2px solid var(--accent)}
.scen-pick{display:grid;gap:8px}
.scen-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
table.scen td.act,table.scen th.act{background:var(--accent-soft)}
table.scen th.grp{text-align:center;border-bottom:1px solid var(--line)}
table.scen th input.cell{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}

/* save bar */
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-bottom:4px}
.gh-btn{background:transparent;color:#e8f6f6;border-color:#3c6b75}
.banner{display:none;max-width:1200px;margin:12px 16px 0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:.88rem;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.banner.show{display:flex}
@media (min-width:1232px){.banner{margin-left:auto;margin-right:auto}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,20,24,.55);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:440px;width:100%;display:grid;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-card input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font:inherit;width:100%}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none}
.savebar.show{display:block}
.savebar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.savebar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.savebar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.class-room{display:grid;gap:6px}
.classrow{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.classrow .ct{grid-row:span 2;display:grid;font-size:.8rem;font-variant-numeric:tabular-nums}
.classrow .ct span{color:var(--muted);font-size:.72rem}
.classrow select.cell{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);min-width:0}
.classrow input.cell{border-color:var(--line);min-width:0}
.classrow.late .ct strong{color:var(--bad)}
.studio-set{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px;margin:8px 0}
.studio-set label{display:grid;gap:2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.studio-set input{border:1px solid var(--line)!important;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink);min-width:0}
table.glance td{white-space:normal;min-width:110px;vertical-align:top}
.gl-time{font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.gl-type{font-size:.78rem;color:var(--accent);font-weight:600}
.gl-sub{font-size:.68rem;text-transform:none;letter-spacing:0;font-weight:500}
.gl-empty{color:var(--muted)}
.class-room .slotrow{display:grid;grid-template-columns:110px 1fr 32px;gap:6px;align-items:center}
.class-room input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);width:100%}
.rm{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);font-size:.75rem;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.rm:hover,.rm:focus-visible{background:var(--bad);color:#fff;border-color:var(--bad)}
.namecell{display:flex;align-items:center;gap:6px}
.namecell input.cell{width:auto}
.dept li .namecell{flex:1;min-width:0}
.dept li .namecell input{width:100%;text-align:left}
.dept-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dept-top input{font-family:var(--display);font-weight:650;font-size:1rem}
tr.addrow td{border-bottom:1px solid var(--line);padding:4px 8px}
.savebar span .btn{margin-left:8px;color:var(--bg)}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px}
.iconbtn:hover{color:var(--bad)}
@media (max-width:700px){ td.stick-col,th.stick-col{position:static} }
@media (max-width:520px){
  .bar-row{grid-template-columns:90px 1fr 90px}
  h2{font-size:1.3rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Shared save through a Google Apps Script web app (no tokens) ---------- */
var REMOTE = null, rmNeedPass = false, rmRev = null, PCKEY = 'wave-ops-passcode';
function rmConfig(){ var cfg = {}; try{ cfg = JSON.parse(document.getElementById('gh-config').textContent) || {}; }catch(e){} return (cfg.endpoint && /^https:\/\//.test(cfg.endpoint)) ? {endpoint:cfg.endpoint} : null; }
function rmPass(){ try{ return localStorage.getItem(PCKEY) || ''; }catch(e){ return ''; } }
function rmLoad(){
  var u = REMOTE.endpoint + (REMOTE.endpoint.indexOf('?') < 0 ? '?' : '&') + 'passcode=' + encodeURIComponent(rmPass()) + '&t=' + Date.now();
  return fetch(u, {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : {error:r.status}; }).catch(function(){ return {error:'network'}; });
}
function rmPush(force){
  var body = JSON.stringify({rev:rmRev, data:S, passcode:rmPass(), force:!!force});
  return fetch(REMOTE.endpoint, {method:'POST', body:body}).then(function(r){ return r.ok ? r.json() : {error:r.status}; }).catch(function(){ return {error:'network'}; });
}
function rmPull(quiet){
  return rmLoad().then(function(res){
    if(res && res.error === 'passcode'){ ghLocked = true; rmNeedPass = true; render(); if(!quiet) askPasscode(); return; }
    rmNeedPass = false;
    if(res && res.error){ if(ghLocked){ ghLocked = false; render(); } if(!quiet) setBanner('Could not reach the save service. Showing the last copy this page has.', 'Try again', function(){ rmPull(false); }); return; }
    ghLocked = false; rmRev = res.rev || 0;
    if(res.data && !dirty){ S = migrate(res.data); markSaved(); }
    setBanner(''); render(); updateSaveState();
  });
}
function askPasscode(){
  var inp = h('input',{type:'password',id:'pc-in',autocomplete:'off','aria-label':'Team password'}), msg = h('p',{class:'note'});
  function close(){ dlg.remove(); }
  var dlg = h('div',{class:'modal',role:'dialog','aria-modal':'true','aria-labelledby':'pc-title'}, h('div',{class:'modal-card'},
    h('h3',{id:'pc-title',text:'Enter the team password'}), h('p',{class:'note',text: rmPass() ? 'That password didn\u2019t work. Try again.' : 'This browser will remember it.'}), inp, msg,

var GH = null, ghLocked = false, ghSha = null, ghUser = '', GHKEY = 'wave-ops-github-token';
